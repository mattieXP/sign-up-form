<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="left-bar">
        <div id="logo-layout">
            <img id="logo-img" src="odin-lined.png">
            <p id="logo-txt">ODIN</p>
        </div>
    </div>
    <div id="right-panel">
        <header id="form-header">
            <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams.</br>Sign up <span class="italic">now</span> to get started.</p>
            <p> You <span class="italic">know</span> you want to.</p>
        </header>
        <form>
            <section class="user-info">
                <legend>Let's do this!</legend>
                <div class="input-fields">
                    <p>
                        <label for="first-name">First name</label>
                        <input type="text" class="first-name" name="user_firstName" required>
                    </p>
                    <p>
                        <label for="last-name">Last name</label>
                        <input type="text" class="last-name" name="user_lastName" required>
                    </p>
                    <p>
                        <label for="email">Email</label>
                        <input type="email" class="email" name="user_email" required>
                    </p>
                    <p>
                        <label for="phone">Phone number</label>
                        <input type="tel" class="phone" name="user_phoneNumber" required>
                    </p>
                    <p>
                        <label for="pwd">Password</label>
                        <input type="password" class="pwd" name="user_password" required>
                    </p>
                    <p>
                        <label for="conf-pwd">Confirm password</label>
                        <input type="password" class="conf-pwd" required>
                    </p>
                </div>
            </section>
            <section class="submission">
                <button type="submit">Create Acount</button>
                <p>Already have an acount? <a class="log-in"href=#1>Log in</a></p>
            </section>
        </form>
    </div>
    
</body>
</html>
